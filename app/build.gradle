plugins {
    id 'com.android.application'
}

def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace 'com.wvoiz.musichub'
    compileSdk 34

    defaultConfig {
        applicationId 'com.wvoiz.musichub'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Only sign in-build when a keystore is configured (local builds).
            // CI has no keystore.properties: leave the config unassigned so
            // AGP produces app-release-unsigned.apk; an empty assigned config
            // fails packageRelease ("missing required property storeFile").
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build unsigned release APK
        run: gradle assembleRelease --console=plain

      - name: Publish APK to a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls app/build/outputs/apk/release/*unsigned*.apk | head -1)
          echo "Built: $APK"
          cp "$APK" WvoizMusicHub-unsigned.apk
          TAG="apk-build-${{ github.run_number }}"
          gh release create "$TAG" WvoizMusicHub-unsigned.apk \
            --title "Wvoiz Music Hub APK - build ${{ github.run_number }}" \
            --notes "Unsigned APK built by GitHub Actions. Muse signs it with the Wvoiz release key before delivery, so future updates install over this build."
